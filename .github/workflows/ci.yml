name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # ajustar a la versión LTS vigente al crear el proyecto
          cache: npm

      - run: npm ci

      # Los scripts "lint", "format:check" y "test" deben existir en package.json.
      # Con --if-present, si un script aún no existe, el paso se omite sin fallar.
      - run: npm run lint --if-present
      - run: npm run format:check --if-present
      - run: npm run build
      - run: npm test --if-present

      # Informativo: no bloquea el PR. Quitar continue-on-error cuando el proyecto esté limpio.
      - run: npm audit --audit-level=high
        continue-on-error: true

      - name: Escaneo de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
